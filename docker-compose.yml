services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cryptonexus-backend-1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/nexus
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
    networks:
      - web
      - internal
    env_file:
      - .env

  migrate:
    build: ./backend
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/nexus
    volumes:
      - ./backend:/app
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cryptonexus-frontend-1
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - web
    env_file:
      - .env

volumes:
  db-data:

networks:
  web:
    external: true
  internal:
    driver: bridge
